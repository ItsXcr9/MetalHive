# MetalHive Agent - Standalone Deployment
# Deploy this on any server you want to manage with MetalHive
# 
# INSTRUCTIONS:
# 1. Copy this file to your target server
# 2. Edit CENTRAL_SERVER_IP to point to your MetalHive central server
# 3. Run: docker compose -f docker-compose.agent.yaml up -d
#
# NOTE: This is the MetalHive orchestrator agent (Docker management).
#       For eBPF observability, use AncientReport's docker-compose.agent.yml

services:
  hive-agent:
    image: registry.xcr9.site/images/metalhive-agent:latest
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: metalhive-agent
    hostname: xcr9

    pid: host
    privileged: true

    environment:
      TZ: ${TZ:-Asia/Tehran}

      CONTROLLER_URL: http://${CENTRAL_SERVER_IP:-localhost}:8080
      HIVE_CONTROLLER: http://${CENTRAL_SERVER_IP:-localhost}:8080
      NATS_URL: nats://${CENTRAL_SERVER_IP:-localhost}:4223

      AGENT_ID: ${AGENT_ID:-30}
      AGENT_LABELS: ${AGENT_LABELS:-main}
      MDNS_ENABLED: "false"
      METRICS_INTERVAL: "10"
      LOG_LEVEL: ${LOG_LEVEL:-error}

      VAULT_SYNC_ENABLED: ${VAULT_SYNC_ENABLED:-true}
      VAULT_SYNC_INTERVAL: ${VAULT_SYNC_INTERVAL:-60}
      VAULT_NAMESPACES: ${VAULT_NAMESPACES:-/global/,/production/}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    restart: unless-stopped

    logging:
      driver: syslog
      options:
        syslog-address: "udp://${CENTRAL_SERVER_IP:-localhost}:1555"
        syslog-facility: "daemon"
        tag: "metalhive-agent"
