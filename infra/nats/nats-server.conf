# NATS JetStream Configuration for MetalHive
# ===========================================

# Server name
server_name: metalhive-nats

# Client connections
port: 4222

# HTTP monitoring
http_port: 8222

# JetStream configuration
jetstream {
    store_dir: /data
    max_memory_store: 256MB
    max_file_store: 1GB
}

# Cluster configuration (for HA setups)
# cluster {
#     name: metalhive-cluster
#     listen: 0.0.0.0:6222
#     routes: [
#         nats-route://nats-1:6222
#         nats-route://nats-2:6222
#     ]
# }

# Logging
debug: false
trace: false
logtime: true

# Authorization (optional)
# authorization {
#     users: [
#         { user: metalhive, password: changeme }
#     ]
# }

# Limits
max_connections: 1000
max_payload: 8MB
max_pending: 64MB

# Write deadline
write_deadline: "10s"
