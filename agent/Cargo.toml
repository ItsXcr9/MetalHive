[package]
name = "metalhive-agent"
version = "0.1.0"
edition = "2021"
authors = ["Xcr9 <team@xcr9.site>"]
description = "MetalHive Agent - Runs on each node to manage Docker containers"
license = "Apache-2.0"
repository = "https://github.com/xcr9/metalhive"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Docker API
bollard = "0.18"

# NATS client
async-nats = "0.38"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Configuration
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# mDNS discovery
mdns-sd = "0.11"

# System metrics
sysinfo = "0.32"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI arguments
clap = { version = "4.5", features = ["derive", "env"] }

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
