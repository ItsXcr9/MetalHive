# =============================================================================
# MetalHive Configuration File
# =============================================================================
# Copy this file to config.yaml and customize for your environment
# =============================================================================

# =============================================================================
# Server Configuration
# =============================================================================
server:
  host: "0.0.0.0"
  port: "8080"
  read_timeout: "30s"
  write_timeout: "30s"

# =============================================================================
# NATS Configuration
# =============================================================================
nats:
  url: "nats://nats:4222"
  reconnect_wait: "2s"
  max_reconnects: -1  # -1 for unlimited

# =============================================================================
# ClickHouse Configuration  
# =============================================================================
clickhouse:
  url: "clickhouse:9000"
  database: "metalhive"
  max_open_conns: 10
  max_idle_conns: 5

# =============================================================================
# DragonflyDB (Redis) Configuration
# =============================================================================
dragonfly:
  addr: "dragonfly:6379"
  password: ""
  db: 0

# =============================================================================
# AI / Gemini Configuration
# =============================================================================
ai:
  enabled: true
  gemini_api_key: "AIzaSyAZOhNPlY5N0M-1yetYR0grC_UN7oNx1Es"
  gemini_model: "gemini-2.5-flash-lite"
  
# =============================================================================
# Logging Configuration
# =============================================================================
log:
  level: "info"  # debug, info, warn, error
  format: "console"  # console, json

# =============================================================================
# Security Configuration
# =============================================================================
security:
  jwt_secret: "change-me-in-production-use-strong-secret"
  encryption_key: "32-byte-key-for-aes-256-encrypt"
  
# =============================================================================
# Telegram Alerts (Optional)
# =============================================================================
telegram:
  enabled: false
  bot_token: ""
  chat_id: ""
